# Configuration for Multi-Agent Book Writer

# Book settings
book:
  # Title is taken from the seed prompt (story bible); this is only a fallback.
  title: ""
  # Chapters used when the seed has no outline and no -c flag is given.
  num_chapters: 5
  # Target chapter length; the writer is told 70%-130% of this value.
  words_per_chapter: 2000
  # Enforced minimum as a fraction of words_per_chapter. Chapters below
  # this are flagged by the lint and sent back for substantive expansion
  # (never padding) during review/revision rounds.
  word_count_tolerance: 0.8
  # Extra revision rounds granted ONLY for length expansion (beyond
  # revision_rounds), continuing while each round still adds >= 15%.
  extra_length_rounds: 2
  # Review/revise rounds per chapter in the editor (lint + reviewer
  # findings are fixed; 0 disables revision).
  revision_rounds: 2

# LLM settings (any OpenAI-compatible endpoint: LM Studio, llama.cpp
# server, vLLM, Ollama's /v1 API, OpenAI, OpenRouter, ...)
llm:
  base_url: "http://192.168.1.225:1234"   # server base URL; /v1/chat/completions is appended
  api_key: ""          # leave empty for local servers; 'env:MY_VAR' reads an env var (LLM_API_KEY is the fallback)
  model: "qwen3.5-9b-the-defiant-fable-uncensored-heretic-neo-imatrix-max-mtp"
  timeout: 600            # seconds per request
  retries: 2              # retries per request (with backoff)

# Agent settings (temperature + enable/disable per agent)
agents:
  architect:
    enabled: true         # builds the story bible from the seed
    temperature: 0.7

  planner:
    enabled: true
    temperature: 0.7

  researcher:             # lore briefs per chapter
    enabled: true
    temperature: 0.7

  writer:
    enabled: true
    temperature: 1.0

  reviewer:
    enabled: true
    temperature: 0.7

  editor:
    enabled: true         # if disabled, raw drafts are saved unedited
    temperature: 0.7

# Output settings
output:
  directory: "output"
  filename: "draft.md"
  overwrite: true         # false -> append -1, -2... instead of clobbering
  interim: true           # write progress artifacts to <directory>/interim/
