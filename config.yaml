# Multi-Agent Book Writer - settings for this machine.
# config.example.yaml documents every option and its default.

book:
  words_per_chapter: 2000
  word_count_tolerance: 0.8     # chapters under 80% of the target are expanded
  revision_rounds: 2
  extra_length_rounds: 2
  summary_window: 8
  review_as_you_go: true       # true: write + review each chapter in turn
  # Chapter count: -c flag > seed outline > LLM suggestion > num_chapters.
  auto_chapters: true
  min_chapters: 3
  max_chapters: 30
  num_chapters: 5

llm:
  base_url: "http://localhost:8080"
  model: "qwen36-i1-champ"
  api_key: ""                   # empty for local servers; "env:VAR" for hosted
  timeout: 3000                 # seconds per request
  retries: 2
  endpoint_wait: 300            # seconds to wait for a downed/reloading server
  # Qwen3.x thinking models: low | medium | xhigh (template default: xhigh).
  # llama.cpp needs --jinja. Comment out to use the template default.
  reasoning_effort: xhigh
  # enable_thinking: false      # hard off-switch (not honoured on Qwen3.8)

# Temperatures are only sent when set, so the model's own defaults apply
# unless you uncomment one.
agents:
  architect:
    # temperature: 0.7
  planner:
    # temperature: 0.7
  researcher:
    enabled: true
    # temperature: 0.7
  writer:
    # temperature: 1.0
  extractor:                    # per-chapter JSON continuity extraction
    # temperature: 0.2
  reviewer:
    enabled: true
    # temperature: 0.7
  editor:
    enabled: true               # false saves the raw drafts unedited
    # temperature: 0.7

# Researcher fact-checking of real-world details via SearXNG (see
# config.example.yaml). If it isn't running, the app offers to start it in Docker.
web_search:
  enabled: true
  searxng_url: "http://localhost:8888"
  auto_start: ask               # ask | yes | no
  # Story names never go into queries; real places you want searched go here.
  allow_terms: [Hampshire, Surrey, England, UK, English, British]

output:
  directory: "output"
  filename: "draft.md"
  overwrite: true               # false appends -1, -2, ... instead
  interim: true                 # progress files; also what resume reads
