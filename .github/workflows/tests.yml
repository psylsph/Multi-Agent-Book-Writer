name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: "Install dependencies (lockfile must be up to date)"
        run: uv sync --locked
      - name: "Lint (bug-catching rules)"
        run: uv run ruff check .
      - name: "Tests (offline - no LLM, network or Docker needed)"
        run: uv run pytest -q
